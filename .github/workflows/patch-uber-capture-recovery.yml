name: Patch Uber capture recovery

on:
  push:
    branches: [experiment/ride-accessibility-screenshot-ocr]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'jfmidon-commits'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch capture recovery and foreground fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt')
          text = path.read_text()

          old = '''        val window = findBestUberWindow()\n        val now = SystemClock.elapsedRealtime()\n        if (\n          isOfferSizedUberWindow(window) &&\n          now >= nextEventCaptureAtElapsed &&\n          retryRunnable == null\n        ) {'''
          new = '''        recoverStaleLocalLease()\n        val window = findBestUberWindow()\n        val uberForeground = isUberForeground()\n        val now = SystemClock.elapsedRealtime()\n        if (\n          (isOfferSizedUberWindow(window) || uberForeground) &&\n          now >= nextEventCaptureAtElapsed &&\n          retryRunnable == null\n        ) {'''
          assert old in text, 'foreground poll block not found'
          text = text.replace(old, new, 1)

          old = '''          val delay = if (isOfferSizedUberWindow(findBestUberWindow())) FOREGROUND_POLL_FAST_MS else FOREGROUND_POLL_IDLE_MS\n          foregroundPollHandler.postDelayed(this, delay)'''
          new = '''          val delay = if (isOfferSizedUberWindow(findBestUberWindow()) || isUberForeground()) FOREGROUND_POLL_FAST_MS else FOREGROUND_POLL_IDLE_MS\n          foregroundPollHandler.postDelayed(this, delay)'''
          assert old in text, 'foreground delay block not found'
          text = text.replace(old, new, 1)

          old = '''    val uberWindow = findBestUberWindow()\n    if (!isOfferSizedUberWindow(uberWindow)) {'''
          new = '''    recoverStaleLocalLease()\n    val uberWindow = findBestUberWindow()\n    val uberForeground = isUberForeground()\n    val offerSizedWindow = isOfferSizedUberWindow(uberWindow)\n    if (!offerSizedWindow && !uberForeground) {'''
          assert old in text, 'attempt capture window block not found'
          text = text.replace(old, new, 1)

          old = '''    activeLease = lease\n    scheduleCaptureWatchdog(trigger, lease)\n    takeDisplayScreenshot(trigger, uberWindow, lease)'''
          new = '''    activeLease = lease\n    scheduleCaptureWatchdog(trigger, lease)\n    // If Accessibility reports only a tiny SYSTEM window, capture the full display instead.\n    // The OCR parser already requires fare + route legs, so non-offer Uber screens are rejected.\n    takeDisplayScreenshot(trigger, if (offerSizedWindow) uberWindow else null, lease)'''
          assert old in text, 'screenshot dispatch block not found'
          text = text.replace(old, new, 1)

          marker = '''  private fun takeDisplayScreenshot(trigger: CaptureTrigger, uberWindow: UberWindowSignal?, lease: CaptureLease) {'''
          insertion = '''  private fun recoverStaleLocalLease() {\n    val lease = activeLease ?: return\n    if (!ScreenshotCaptureCoordinator.isActive(lease)) {\n      activeLease = null\n      captureWatchdogRunnable?.let { retryHandler.removeCallbacks(it) }\n      captureWatchdogRunnable = null\n    }\n  }\n\n  private fun isUberForeground(): Boolean {\n    var root = try { rootInActiveWindow } catch (_: Exception) { null }\n    return try {\n      root?.packageName?.toString()?.lowercase(Locale.ROOT) == UBER_PACKAGE\n    } catch (_: Exception) {\n      false\n    } finally {\n      try { root?.recycle() } catch (_: Exception) {}\n    }\n  }\n\n'''
          assert marker in text, 'takeDisplayScreenshot marker not found'
          text = text.replace(marker, insertion + marker, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          git rm .github/workflows/patch-uber-capture-recovery.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(android): recover Uber capture when accessibility window collapses"
          git push origin HEAD:experiment/ride-accessibility-screenshot-ocr
