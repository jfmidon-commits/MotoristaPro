name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [experiment/ride-accessibility-screenshot-ocr]
    paths:
      - "src/**"
      - "modules/**"
      - "App.tsx"
      - "app.json"
      - "package.json"
      - ".env.example"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: experiment/ride-accessibility-screenshot-ocr

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Configure MotoristaPro Supabase
        run: cp .env.example .env.local

      - name: Harden offer capture admission and retries
        shell: python
        run: |
          from pathlib import Path

          uber = Path('modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt')
          s = uber.read_text()

          s = s.replace(
              '([0-9]{1,5}(?:[.,][0-9]{1,2})?)',
              '([1-9][0-9]{0,4}(?:[.,][0-9]{1,2})?)',
              1
          )
          s = s.replace(
              'private const val CAPTURE_WATCHDOG_MS = 8_000L',
              'private const val CAPTURE_WATCHDOG_MS = 8_000L\n    private const val RECENT_UBER_EVENT_GRACE_MS = 3_500L',
              1
          )
          s = s.replace(
              'private var consecutiveNoOfferSequences = 0',
              'private var consecutiveNoOfferSequences = 0\n  private var lastUberEventAtElapsed = 0L',
              1
          )
          s = s.replace(
              'if (eventPackage != null && eventPackage != UBER_PACKAGE) return\n\n    val elapsed = SystemClock.elapsedRealtime()',
              'if (eventPackage != null && eventPackage != UBER_PACKAGE) return\n\n    val elapsed = SystemClock.elapsedRealtime()\n    lastUberEventAtElapsed = elapsed',
              1
          )
          s = s.replace(
              'if (!offerSizedWindow && !uberForeground) {',
              'if (!offerSizedWindow && !uberForeground && elapsedSinceLastUberEvent() > RECENT_UBER_EVENT_GRACE_MS) {',
              1
          )
          s = s.replace(
              'private fun isUberForeground(): Boolean {',
              'private fun elapsedSinceLastUberEvent(): Long {\n    val last = lastUberEventAtElapsed\n    if (last <= 0L) return Long.MAX_VALUE\n    return (SystemClock.elapsedRealtime() - last).coerceAtLeast(0L)\n  }\n\n  private fun isUberForeground(): Boolean {',
              1
          )

          p99 = Path('modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/Ride99AccessibilityService.kt')
          s99 = p99.read_text()
          s99 = s99.replace('bestScore <= dp(48)', 'bestScore <= dp(140)', 1)
          p99.write_text(s99)
          uber.write_text(s)

      - name: Verify offer capture hardening
        run: |
          grep -Fq 'RECENT_UBER_EVENT_GRACE_MS = 3_500L' modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          grep -Fq 'elapsedSinceLastUberEvent() > RECENT_UBER_EVENT_GRACE_MS' modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          grep -Fq 'bestScore <= dp(140)' modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/Ride99AccessibilityService.kt
          git diff --check

      - name: Commit offer capture hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/Ride99AccessibilityService.kt
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "fix(android): harden offer capture retries"
          git push origin HEAD:experiment/ride-accessibility-screenshot-ocr

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Ensure splash background resource
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/motoristapro_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="splashscreen_background">#0F172A</color>
          </resources>
          EOF

      - name: Native capture stability tests
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :motorista-notification-listener:testReleaseUnitTest --no-daemon

      - name: Build standalone APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          unzip -tq "$apk"
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools_dir/apksigner" verify --verbose "$apk"
          "$build_tools_dir/aapt" dump badging "$apk" | tee MotoristaPro-apk-badging.txt
          grep -Fq "package: name='com.motoristapro.app'" MotoristaPro-apk-badging.txt

      - name: Rename APK
        run: |
          short_sha="${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/release/app-release.apk "MotoristaPro-${short_sha}-test.apk"
          sha256sum "MotoristaPro-${short_sha}-test.apk" > "MotoristaPro-${short_sha}-test.apk.sha256"
          printf 'source_commit=%s\nworkflow_run=%s\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > MotoristaPro-build.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoristaPro-Android-${{ github.sha }}
          path: |
            MotoristaPro-*-test.apk
            MotoristaPro-*-test.apk.sha256
            MotoristaPro-apk-badging.txt
            MotoristaPro-build.txt
          if-no-files-found: error
          retention-days: 14
