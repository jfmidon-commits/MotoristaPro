name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - stabilize/offline-sync
      - experiment/ride-accessibility-screenshot-ocr
    paths:
      - "src/**"
      - "modules/**"
      - "App.tsx"
      - "app.json"
      - "package.json"
      - ".env.example"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Apply stale local screenshot lease recovery
        if: github.ref == 'refs/heads/experiment/ride-accessibility-screenshot-ocr' || github.event.pull_request.head.ref == 'experiment/ride-accessibility-screenshot-ocr'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt')
          s = p.read_text()
          old = '''      try {
        val window = findBestUberWindow()
        val now = SystemClock.elapsedRealtime()
        if (
          isOfferSizedUberWindow(window) &&
          now >= nextEventCaptureAtElapsed &&
          retryRunnable == null &&
          activeLease == null
        ) {'''
          new = '''      try {
        recoverStaleLocalLease()
        val window = findBestUberWindow()
        val now = SystemClock.elapsedRealtime()
        if (
          isOfferSizedUberWindow(window) &&
          now >= nextEventCaptureAtElapsed &&
          retryRunnable == null &&
          activeLease == null
        ) {'''
          if old not in s:
              raise SystemExit('watchdog block not found')
          s = s.replace(old, new, 1)
          marker = '''  private fun isRelevantEventType(eventType: Int): Boolean =
'''
          helper = '''  /**
   * Android can drop a screenshot callback after the process-wide lease has
   * expired. Clear the service-local token so the foreground watchdog can
   * acquire a fresh lease instead of remaining permanently stalled.
   */
  private fun recoverStaleLocalLease() {
    val lease = activeLease ?: return
    if (!ScreenshotCaptureCoordinator.isActive(lease)) {
      activeLease = null
    }
  }

'''
          if marker not in s:
              raise SystemExit('helper marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY

          git diff --check
          grep -n "recoverStaleLocalLease" modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          if [ -f .github/workflows/patch-capture-lease-recovery.yml ]; then
            git rm .github/workflows/patch-capture-lease-recovery.yml
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'fix(android): recover stale local screenshot lease'
            git push origin HEAD:experiment/ride-accessibility-screenshot-ocr
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Configure MotoristaPro Supabase
        run: cp .env.example .env.local

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Ensure splash background resource
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/motoristapro_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="splashscreen_background">#0F172A</color>
          </resources>
          EOF

      - name: Native capture stability tests
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :motorista-notification-listener:testReleaseUnitTest --no-daemon

      - name: Build standalone APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK integrity, signature and package
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          unzip -tq "$apk"
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$build_tools_dir"
          "$build_tools_dir/apksigner" verify --verbose "$apk"
          "$build_tools_dir/aapt" dump badging "$apk" | tee MotoristaPro-apk-badging.txt
          grep -Fq "package: name='com.motoristapro.app'" MotoristaPro-apk-badging.txt

      - name: Rename APK
        run: |
          short_sha="${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/release/app-release.apk "MotoristaPro-${short_sha}-test.apk"
          sha256sum "MotoristaPro-${short_sha}-test.apk" > "MotoristaPro-${short_sha}-test.apk.sha256"
          printf 'trigger_sha=%s\nsource_commit=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > MotoristaPro-build.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoristaPro-Android-${{ github.sha }}
          path: |
            MotoristaPro-*-test.apk
            MotoristaPro-*-test.apk.sha256
            MotoristaPro-apk-badging.txt
            MotoristaPro-build.txt
          if-no-files-found: error
          retention-days: 14

# Triggered explicitly for the current Uber OCR fix build.
