name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [experiment/ride-accessibility-screenshot-ocr]
    paths:
      - "src/**"
      - "modules/**"
      - "App.tsx"
      - "app.json"
      - "package.json"
      - ".env.example"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: experiment/ride-accessibility-screenshot-ocr

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Configure MotoristaPro Supabase
        run: cp .env.example .env.local

      - name: Apply capture reliability fix
        shell: python
        run: |
          from pathlib import Path

          root = Path('modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener')
          uber = root / 'RideAccessibilityService.kt'
          s = uber.read_text()

          s = s.replace('private const val CAPTURE_WATCHDOG_MS = 8_000L', 'private const val CAPTURE_WATCHDOG_MS = 8_000L\n    private const val RECENT_UBER_EVENT_GRACE_MS = 8_000L', 1)
          s = s.replace('private var consecutiveNoOfferSequences = 0', 'private var consecutiveNoOfferSequences = 0\n  private var lastUberEventAtElapsed = 0L', 1)
          s = s.replace('val elapsed = SystemClock.elapsedRealtime()\n    val strongSignal', 'val elapsed = SystemClock.elapsedRealtime()\n    lastUberEventAtElapsed = elapsed\n    val strongSignal', 1)
          s = s.replace('if (!offerSizedWindow && !uberForeground) {', 'if (!offerSizedWindow && !uberForeground && elapsedSinceLastUberEvent() > RECENT_UBER_EVENT_GRACE_MS) {', 1)
          s = s.replace('private fun isUberForeground(): Boolean {', 'private fun elapsedSinceLastUberEvent(): Long {\n    val last = lastUberEventAtElapsed\n    if (last <= 0L) return Long.MAX_VALUE\n    return (SystemClock.elapsedRealtime() - last).coerceAtLeast(0L)\n  }\n\n  private fun isUberForeground(): Boolean {', 1)
          s = s.replace('private const val FOREGROUND_POLL_FAST_MS = 1_200L', 'private const val FOREGROUND_POLL_FAST_MS = 900L', 1)
          s = s.replace('private const val FOREGROUND_POLL_IDLE_MS = 5_000L', 'private const val FOREGROUND_POLL_IDLE_MS = 2_500L', 1)
          s = s.replace('private val IDLE_BACKOFF_MS = longArrayOf(1_500L, 3_000L, 5_000L, 8_000L)', 'private val IDLE_BACKOFF_MS = longArrayOf(1_000L, 2_000L, 3_000L, 4_000L)', 1)
          s = s.replace('private const val MIN_UBER_WINDOW_AREA_RATIO = 0.08', 'private const val MIN_UBER_WINDOW_AREA_RATIO = 0.04', 1)
          s = s.replace('private const val MIN_UBER_WINDOW_WIDTH_RATIO = 0.40', 'private const val MIN_UBER_WINDOW_WIDTH_RATIO = 0.25', 1)
          s = s.replace('private const val MIN_UBER_WINDOW_HEIGHT_RATIO = 0.12', 'private const val MIN_UBER_WINDOW_HEIGHT_RATIO = 0.08', 1)

          old = '''    val detectedActionLine = allLines.filter { ACTION_REGEX.containsMatchIn(it.text) }.maxByOrNull { centerY(it.bounds) }\n    val actionLine = detectedActionLine ?: return null\n    val eligibleFares = allLines.filter { line ->\n      if (detectedActionLine != null && line.bounds.bottom >= detectedActionLine.bounds.top) return@filter false\n'''
          new = '''    val detectedActionLine = allLines.filter { ACTION_REGEX.containsMatchIn(it.text) }.maxByOrNull { centerY(it.bounds) }\n    val eligibleFares = allLines.filter { line ->\n      if (detectedActionLine != null && line.bounds.bottom >= detectedActionLine.bounds.top) return@filter false\n'''
          if old not in s:
              raise SystemExit('Uber admission gate pattern not found')
          s = s.replace(old, new, 1)

          old2 = '''    val mainFare = eligibleFares.maxWithOrNull(compareBy<OcrLineRecord> { it.bounds.height() }.thenBy { it.bounds.width() }.thenBy { centerY(it.bounds) }) ?: return null\n    if (actionLine.bounds.top <= mainFare.bounds.bottom && detectedActionLine != null) return null\n    val inferredBottom = if (detectedActionLine != null) actionLine.bounds.bottom else (mainFare.bounds.bottom + dp(900)).coerceAtMost(resources.displayMetrics.heightPixels)\n'''
          new2 = '''    val mainFare = eligibleFares.maxWithOrNull(compareBy<OcrLineRecord> { it.bounds.height() }.thenBy { it.bounds.width() }.thenBy { centerY(it.bounds) }) ?: return null\n    val actionLine = detectedActionLine ?: OcrLineRecord("", Rect(mainFare.bounds.left, resources.displayMetrics.heightPixels, mainFare.bounds.right, resources.displayMetrics.heightPixels))\n    if (detectedActionLine != null && actionLine.bounds.top <= mainFare.bounds.bottom) return null\n    val inferredBottom = if (detectedActionLine != null) actionLine.bounds.bottom else resources.displayMetrics.heightPixels\n'''
          if old2 not in s:
              raise SystemExit('Uber synthetic action pattern not found')
          s = s.replace(old2, new2, 1)

          # Compact OCR such as "21-3 min" means approximately 2.1 km / 3 min.
          marker = '  private fun parseDurationMinutes(text: String): Int? {'
          helper = '''  private fun parseCompactRouteSignal(text: String, top: Int): CompactRouteSignal? {\n    val normalized = text.lowercase(Locale.ROOT).replace("•", "-").replace("·", "-").replace("—", "-").replace("–", "-").trim()\n    val explicit = Regex("""\\b([0-9]{1,3}(?:[.,][0-9]{1,2})?)\\s*km?\\s*-\\s*([0-9]{1,3})\\s*min\\b""", RegexOption.IGNORE_CASE).find(normalized)\n    if (explicit != null) {\n      val km = parseDecimal(explicit.groupValues[1]) ?: return null\n      val minutes = explicit.groupValues[2].toIntOrNull() ?: return null\n      return CompactRouteSignal(minutes, km, top)\n    }\n    val compact = Regex("""\\b([0-9]{2,3})-([0-9]{1,3})\\s*min\\b""", RegexOption.IGNORE_CASE).find(normalized) ?: return null\n    val raw = compact.groupValues[1]\n    val km = when (raw.length) {\n      2 -> raw.substring(0, 1).toDoubleOrNull()?.plus((raw.substring(1, 2).toDoubleOrNull() ?: return null) / 10.0)\n      3 -> raw.substring(0, 2).toDoubleOrNull()?.plus((raw.substring(2, 3).toDoubleOrNull() ?: return null) / 10.0)\n      else -> null\n    } ?: return null\n    val minutes = compact.groupValues[2].toIntOrNull() ?: return null\n    return CompactRouteSignal(minutes, km, top)\n  }\n\n'''
          if marker not in s:
              raise SystemExit('duration marker not found')
          s = s.replace(marker, helper + marker, 1)

          old3 = '''    if (direct.size in 2..3) return direct.values.sortedBy { it.top }\n    val timeLines = routeLines.mapNotNull { line -> parseDurationMinutes(line.text)?.let { it to line } }\n'''
          new3 = '''    if (direct.size in 2..4) return direct.values.sortedBy { it.top }\n    val compactSignals = routeLines.mapNotNull { line -> parseCompactRouteSignal(line.text, line.bounds.top) }\n    val compact = LinkedHashMap<String, RouteLeg>()\n    compactSignals.forEach { signal ->\n      val key = signal.minutes.toString() + "|" + String.format(Locale.US, "%.2f", signal.km)\n      compact.putIfAbsent(key, RouteLeg(signal.minutes, signal.km, signal.top))\n    }\n    if (compact.size in 2..4) return compact.values.sortedBy { it.top }\n    val timeLines = routeLines.mapNotNull { line -> parseDurationMinutes(line.text)?.let { it to line } }\n'''
          if old3 not in s:
              raise SystemExit('route parser insertion point not found')
          s = s.replace(old3, new3, 1)
          uber.write_text(s)

          # 99 parser: do not reject a valid fare/route solely because OCR missed one leg.
          p99 = root / 'Ride99AccessibilityService.kt'
          s99 = p99.read_text()
          s99 = s99.replace('if (legs.size !in 2..3) return null', 'if (legs.isEmpty() || legs.size > 3) return null', 1)
          p99.write_text(s99)

          coord = root / 'ScreenshotCaptureCoordinator.kt'
          sc = coord.read_text()
          sc = sc.replace('private const val MIN_START_INTERVAL_MS = 700L', 'private const val MIN_START_INTERVAL_MS = 450L', 1)
          sc = sc.replace('private const val LEASE_TIMEOUT_MS = 12_000L', 'private const val LEASE_TIMEOUT_MS = 9_000L', 1)
          coord.write_text(sc)

      - name: Verify capture reliability fix
        run: |
          grep -Fq 'RECENT_UBER_EVENT_GRACE_MS = 8_000L' modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          grep -Fq 'resources.displayMetrics.heightPixels' modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          grep -Fq 'parseCompactRouteSignal' modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          grep -Fq 'MIN_UBER_WINDOW_AREA_RATIO = 0.04' modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          grep -Fq 'MIN_START_INTERVAL_MS = 450L' modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/ScreenshotCaptureCoordinator.kt

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Ensure splash background resource
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/motoristapro_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="splashscreen_background">#0F172A</color>
          </resources>
          EOF

      - name: Native capture stability tests
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :motorista-notification-listener:testReleaseUnitTest --no-daemon

      - name: Build standalone APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          unzip -tq "$apk"
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools_dir/apksigner" verify --verbose "$apk"
          "$build_tools_dir/aapt" dump badging "$apk" | tee MotoristaPro-apk-badging.txt
          grep -Fq "package: name='com.motoristapro.app'" MotoristaPro-apk-badging.txt

      - name: Rename APK
        run: |
          short_sha="${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/release/app-release.apk "MotoristaPro-${short_sha}-test.apk"
          sha256sum "MotoristaPro-${short_sha}-test.apk" > "MotoristaPro-${short_sha}-test.apk.sha256"
          printf 'source_commit=%s\nworkflow_run=%s\n' "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > MotoristaPro-build.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoristaPro-Android-${{ github.sha }}
          path: |
            MotoristaPro-*-test.apk
            MotoristaPro-*-test.apk.sha256
            MotoristaPro-apk-badging.txt
            MotoristaPro-build.txt
          if-no-files-found: error
          retention-days: 14
