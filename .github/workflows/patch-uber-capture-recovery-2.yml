name: Patch Uber foreground fallback trigger

on:
  push:
    branches: [experiment/ride-accessibility-screenshot-ocr]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'jfmidon-commits'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix fallback trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt')
          text = path.read_text()
          old = '          attemptCapture(CaptureTrigger(AccessibilityEvent.TYPE_WINDOWS_CHANGED, window!!.id, 0, chainId))'
          new = '          attemptCapture(CaptureTrigger(AccessibilityEvent.TYPE_WINDOWS_CHANGED, window?.id ?: -1, 0, chainId))'
          assert old in text, 'nullable window trigger not found'
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          git rm .github/workflows/patch-uber-capture-recovery-2.yml
          git diff --cached --check
          git commit -m "fix(android): allow Uber foreground fallback without window id"
          git push origin HEAD:experiment/ride-accessibility-screenshot-ocr
