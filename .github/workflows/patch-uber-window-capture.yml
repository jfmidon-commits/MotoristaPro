name: Apply Uber OCR capture fix

on:
  push:
    branches:
      - experiment/ride-accessibility-screenshot-ocr

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Uber screenshot capture and card detection
        env:
          FILE: modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt")
          s = p.read_text()
          old = 'private val ACTION_REGEX = Regex("""\\b(?:Aceitar|Selecionar)\\b""", RegexOption.IGNORE_CASE)'
          new = 'private val ACTION_REGEX = Regex("""\\b(?:Aceitar|Aceite|Selecionar|Recusar|Deslize|Confirmar)\\b""", RegexOption.IGNORE_CASE)'
          if old not in s:
              raise SystemExit("ACTION_REGEX target not found")
          s = s.replace(old, new, 1)
          old_call = '      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {'
          new_call = '''      val screenshotCallback = object : TakeScreenshotCallback {'''
          if old_call not in s:
              raise SystemExit("screenshot call target not found")
          s = s.replace(old_call, new_call, 1)
          old_close = '''      })
    } catch (_: SecurityException) {'''
          new_close = '''      }
      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE && uberWindow != null) {
        try {
          takeScreenshotOfWindow(uberWindow.id, mainExecutor, screenshotCallback)
        } catch (_: Exception) {
          takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, screenshotCallback)
        }
      } else {
        takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, screenshotCallback)
      }
    } catch (_: SecurityException) {'''
          if old_close not in s:
              raise SystemExit("screenshot callback close target not found")
          s = s.replace(old_close, new_close, 1)
          old_card = '''    val actionLine = allLines.filter { ACTION_REGEX.containsMatchIn(it.text) }.maxByOrNull { centerY(it.bounds) } ?: return null
    val eligibleFares = allLines.filter { line ->
      if (line.bounds.bottom >= actionLine.bounds.top) return@filter false
      val normalized = normalize(line.text)
      if (normalized.contains("/km") || normalized.contains("aprox") || normalized.contains("incluido") || normalized.contains("incluído") || normalized.trimStart().startsWith("+")) return@filter false
      FARE_REGEX.containsMatchIn(line.text)
    }
    if (eligibleFares.isEmpty()) return null
    val mainFare = eligibleFares.maxWithOrNull(compareBy<OcrLineRecord> { it.bounds.height() }.thenBy { it.bounds.width() }.thenBy { centerY(it.bounds) }) ?: return null
    if (actionLine.bounds.top <= mainFare.bounds.bottom) return null
'''
          new_card = '''    val detectedActionLine = allLines.filter { ACTION_REGEX.containsMatchIn(it.text) }.maxByOrNull { centerY(it.bounds) }
    val actionLine = detectedActionLine
      ?: allLines.maxByOrNull { it.bounds.bottom }
      ?: return null
    val eligibleFares = allLines.filter { line ->
      if (detectedActionLine != null && line.bounds.bottom >= detectedActionLine.bounds.top) return@filter false
      val normalized = normalize(line.text)
      if (normalized.contains("/km") || normalized.contains("aprox") || normalized.contains("incluido") || normalized.contains("incluído") || normalized.trimStart().startsWith("+")) return@filter false
      FARE_REGEX.containsMatchIn(line.text)
    }
    if (eligibleFares.isEmpty()) return null
    val mainFare = eligibleFares.maxWithOrNull(compareBy<OcrLineRecord> { it.bounds.height() }.thenBy { it.bounds.width() }.thenBy { centerY(it.bounds) }) ?: return null
    if (actionLine.bounds.top <= mainFare.bounds.bottom && detectedActionLine != null) return null
    val inferredBottom = if (detectedActionLine != null) actionLine.bounds.bottom else (mainFare.bounds.bottom + dp(900)).coerceAtMost(resources.displayMetrics.heightPixels)
'''
          if old_card not in s:
              raise SystemExit("card detection target not found")
          s = s.replace(old_card, new_card, 1)
          old_bottom = '    val cardBottom = actionLine.bounds.bottom + dp(20)'
          new_bottom = '    val cardBottom = if (detectedActionLine != null) actionLine.bounds.bottom + dp(20) else inferredBottom'
          if old_bottom not in s:
              raise SystemExit("card bottom target not found")
          s = s.replace(old_bottom, new_bottom, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- "$FILE"
      - name: Commit source patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          git rm .github/workflows/patch-uber-window-capture.yml
          git commit -m "fix(android): capture Uber window directly for OCR [skip ci]"
          git push
