name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        id: unit_tests
        shell: bash
        run: |
          set +e
          npm test -- --ci --json --outputFile=test-results.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json

      - name: Falhar CI quando testes falharem
        if: steps.unit_tests.outputs.exit_code != '0'
        run: exit 1
