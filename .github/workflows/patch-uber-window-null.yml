name: Patch Uber window null fallback

on:
  push:
    branches: [experiment/ride-accessibility-screenshot-ocr]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'jfmidon-commits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt')
          s=p.read_text()
          old='          attemptCapture(CaptureTrigger(AccessibilityEvent.TYPE_WINDOWS_CHANGED, window!!.id, 0, chainId))'
          new='          attemptCapture(CaptureTrigger(AccessibilityEvent.TYPE_WINDOWS_CHANGED, window?.id ?: -1, 0, chainId))'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/motorista-notification-listener/android/src/main/java/expo/modules/motoristanotificationlistener/RideAccessibilityService.kt
          git rm .github/workflows/patch-uber-window-null.yml
          git diff --cached --check
          git commit -m "fix(android): handle missing Uber accessibility window"
          git push origin HEAD:experiment/ride-accessibility-screenshot-ocr
